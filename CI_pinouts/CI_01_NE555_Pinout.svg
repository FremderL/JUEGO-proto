<text x="1080" y="302" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#153b5b" font-weight="bold" text-anchor="start">PUNTOS A REVISAR</text>
<text x="1080" y="340" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• U1 y U2 son temporizadores distintos.</text>
<text x="1080" y="382" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• Pin 3 es la salida de reloj.</text>
<text x="1080" y="424" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• Pin 4 debe estar alto para funcionar.</text>
<text x="1080" y="466" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• Pines 2 y 6 se unen en astable.</text>
