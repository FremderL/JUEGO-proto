<text x="1080" y="340" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• 1G y 2G son habilitaciones activas en bajo.</text>
<text x="1080" y="382" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• Cuando G = 1, las salidas quedan en alta impedancia.</text>
<text x="1080" y="424" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• Sólo un buffer debe estar habilitado.</text>
<text x="1080" y="466" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f707b" font-weight="normal" text-anchor="start">• U7 lleva unidades/decenas; U8 centenas.</text>
